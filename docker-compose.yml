x-common-env: &common-env
  POSTGRES_DB: ${POSTGRES_DB}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /data/postgres
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    extends:
      file: common-config.yml
      service: network-deploy-service
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - vigil-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
  kafka:
    image: apache/kafka:latest
    container_name: vigil-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    extends:
      file: common-config.yml
      service: network-deploy-service
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "vigil-cluster-01"
    volumes:
      - kafka-data:/var/lib/kafka/data
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vigil-kafka-ui
    ports:
      - "8090:8080"
    extends:
      file: common-config.yml
      service: network-deploy-service
    environment:
      KAFKA_CLUSTERS_0_NAME: vigil-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
  eureka-server:
    image: eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    extends:
      file: common-config.yml
      service: network-deploy-service
    depends_on:
      config-server:
        condition: service_healthy
  config-server:
    image: config-server:latest
    container_name: config-server
    ports:
      - "8888:8888"
    extends:
      file: common-config.yml
      service: network-deploy-service
  sheets-service:
    image: sheets-service:latest
    container_name: sheets-service
    ports:
      - "8080:8080"
    extends:
      file: common-config.yml
      service: network-deploy-service
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
  scraper-service:
    image: scraper-service:latest
    container_name: scraper-service
    ports:
      - "8081:8081"
    extends:
      file: common-config.yml
      service: network-deploy-service
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
networks:
  vigil-net:
    driver: bridge

volumes:
  postgres:
    driver: local
  pgadmin:
    driver: local
  kafka-data:
    driver: local