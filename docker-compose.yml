services:
  postgres:
    container_name: postgres:16-alpine
    image: postgres
    environment:
      POSTGRES_USER: ptnaza
      POSTGRES_PASSWORD: ptnaza
      PGDATA: /data/postgres
      POSTGRES_DB: vigil-db
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    extends:
      file: common-config.yml
      service: network-deploy-service
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ptnaza" ]
      interval: 10s
      timeout: 5s
      retries: 5
